[project]
name = "compania-voz"
version = "0.1.0"
description = "Agente conversacional de voz para personas adultas mayores"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[aws-nova-sonic,google,openai,runner,silero,webrtc,websocket]>=1.15,<2",
    "boto3>=1.35",
    "pipecat-asterisk>=0.1.4,<0.2",
    "python-dotenv>=1.0",
    "ddgs>=9.16.1",
    "segno>=1.6",
]

[project.scripts]
compania-bot = "compania.agente.bot:main"
compania-semilla = "compania.agente.semilla:main"
compania-panel = "compania.panel.app:main"
compania-llamar = "compania.agente.llamar:main"
compania-asterisk = "compania.agente.asterisk:main"
compania-llamar-app = "compania.agente.asterisk:llamar"
compania-whatsapp = "compania.agente.whatsapp:main"
compania-llamar-wa = "compania.agente.whatsapp:llamar"
compania-programador = "compania.agente.programador:main"
compania-datos = "compania.agente.datos:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compania"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
