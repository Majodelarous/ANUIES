[project]
name = "compania-voz"
version = "0.1.0"
description = "Agente conversacional de voz para personas adultas mayores"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[google,runner,silero,webrtc,websocket]>=1.15,<2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
nova = ["pipecat-ai[aws-nova-sonic]>=1.15,<2"]

[project.scripts]
compania-bot = "compania.agente.bot:main"
compania-semilla = "compania.agente.semilla:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compania"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
