; La asistente llama a la persona: channel originate PJSIP/<cuenta> extension compania@salida
[salida]
exten = compania,1,Answer()
 same = n,Dial(WebSocket/pipecat/c(slin16))
 same = n,Hangup()

; La persona llama a la asistente marcando 100 desde Linphone
[desde-app]
exten = 100,1,Answer()
 same = n,Dial(WebSocket/pipecat/c(slin16))
 same = n,Hangup()
