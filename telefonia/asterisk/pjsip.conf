[transporte-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[cuenta-app](!)
type = endpoint
context = desde-app
allow = !all,opus,g722,ulaw,alaw
direct_media = no
dtmf_mode = rfc4733
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[auth-app](!)
type = auth
auth_type = userpass
; Debe coincidir con el realm que usa qr.sh para calcular ha1
realm = asterisk

[aor-app](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 60

; Las cuentas (usuario y contraseña) se generan con configurar.sh y no se suben al repositorio.
#include pjsip_cuentas.conf
